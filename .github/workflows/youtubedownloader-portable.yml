name: FluxMidia Windows 10-11

on:
  push:
    branches:
      - integrar-youtubedownloader-portatil
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar este repositório
        uses: actions/checkout@v4

      - name: Preparar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Preparar Python para modulo redes sociais
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar código base legend2ks/YoutubeDownloader
        shell: pwsh
        run: |
          git clone --recursive https://github.com/legend2ks/YoutubeDownloader.git upstream
          Set-Location upstream
          git checkout be1e8705336ef7f38ef40d8bed9f66f4b46c185d
          git submodule update --init --recursive

      - name: Aplicar interface PT-BR e fila ampliada
        shell: pwsh
        run: |
          ./integration/apply-customizations.ps1 -Root "$PWD/upstream"

      - name: Publicar aplicativo self-contained para Windows 10/11 x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$PWD/package" | Out-Null
          dotnet publish "$PWD/upstream/YoutubeApp/YoutubeApp.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o "$PWD/package" `
            -p:DebugType=None `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Baixar yt-dlp, aria2 e ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $utils = "$PWD/package/utils"
          New-Item -ItemType Directory -Force -Path $utils | Out-Null

          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$utils/yt-dlp.exe"

          Invoke-WebRequest -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile "$PWD/aria2.zip"
          Expand-Archive "$PWD/aria2.zip" "$PWD/aria2" -Force
          $aria = Get-ChildItem "$PWD/aria2" -Recurse -Filter "aria2c.exe" | Select-Object -First 1
          if (-not $aria) { throw "aria2c.exe nao encontrado" }
          Copy-Item $aria.FullName "$utils/aria2c.exe" -Force

          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile "$PWD/ffmpeg.zip"
          Expand-Archive "$PWD/ffmpeg.zip" "$PWD/ffmpeg" -Force
          $ffmpeg = Get-ChildItem "$PWD/ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe nao encontrado" }
          Copy-Item $ffmpeg.FullName "$utils/ffmpeg.exe" -Force

      - name: Gerar modulo redes sociais portátil sem alterar o motor YouTube
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller yt-dlp pillow
          python "$PWD/tools/generate_fluxmidia_icon.py"
          python -m py_compile "$PWD/main_multisite.py" "$PWD/disc_tools.py" "$PWD/fluxmidia_modern.py"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FluxMidia --icon "$PWD/app_icon.ico" --collect-all yt_dlp --add-binary "$PWD/package/utils/ffmpeg.exe;bin" "$PWD/fluxmidia_modern.py"
          Copy-Item "$PWD/dist/FluxMidia.exe" "$PWD/package/FluxMidia.exe" -Force
          Copy-Item "$PWD/dist/FluxMidia.exe" "$PWD/package/RedesSociaisDownloader.exe" -Force

          @"
          MODULO DE REDES SOCIAIS
          -----------------------
          Abra FluxMidia.exe para YouTube, TikTok, Facebook e CD/DVD. A interface moderna usa o motor original de main_multisite.py e disc_tools.py.
          Ao copiar um link compativel, ele aparece automaticamente na lista.
          Escolha Audio ou Video MP4 antes de iniciar.
          A fila aceita ate 1000 links e ignora repetidos.
          O botão Converte CD/DVD abre uma segunda interface integrada, adaptada das funções úteis do K3b para Windows.
          O motor principal do YouTube/playlist permanece separado e intacto.

          Use apenas videos que voce tenha permissao para baixar.
          "@ | Set-Content "$PWD/package/LEIA-ME-REDES-SOCIAIS.txt" -Encoding UTF8

      - name: Incluir licença e informação do código-fonte
        shell: pwsh
        run: |
          Copy-Item "$PWD/upstream/LICENSE" "$PWD/package/LICENSE-YoutubeDownloader-LGPL-2.1.txt"
          @"
          Aplicativo baseado em:
          https://github.com/legend2ks/YoutubeDownloader
          Commit base: be1e8705336ef7f38ef40d8bed9f66f4b46c185d

          Customizações PT-BR, fila de até 1000 links, modulo YouTube/TikTok/Facebook e empacotamento portátil:
          https://github.com/alvesleiteevaldo-crypto/Mp3Yo/tree/integrar-youtubedownloader-portatil

          Use apenas conteúdo que você tenha autorização para baixar.
          "@ | Set-Content "$PWD/package/CODIGO_FONTE_E_AVISO.txt" -Encoding UTF8

      - name: Compactar versão portátil
        shell: pwsh
        run: |
          Compress-Archive -Path "$PWD/package/*" -DestinationPath "$PWD/Conversor-Video-Audio-PTBR-Windows10-11-x64.zip" -Force

      - name: Gerar instalador EXE para Windows 10/11
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Copy-Item "$PWD/app_icon.ico" "$PWD/installer/app_icon.ico" -Force
          Copy-Item -Recurse "$PWD/package" "$PWD/installer/package" -Force
          Push-Location "$PWD/installer"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "ConversorEvaldo.iss"
          Pop-Location
          $setup = Get-ChildItem "$PWD/installer" -Filter "FluxMidia-Setup-Windows10-11-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Instalador EXE não foi gerado." }
          Copy-Item $setup.FullName "$PWD/FluxMidia-Setup-Windows10-11-x64.exe" -Force

      - name: Publicar instalador EXE
        uses: actions/upload-artifact@v4
        with:
          name: FluxMidia-Setup-Windows10-11-x64
          path: FluxMidia-Setup-Windows10-11-x64.exe
          if-no-files-found: error
          retention-days: 30


      - name: Publicar arquivo para download
        uses: actions/upload-artifact@v4
        with:
          name: Conversor-Video-Audio-PTBR-Windows10-11-x64
          path: Conversor-Video-Audio-PTBR-Windows10-11-x64.zip
          if-no-files-found: error
          retention-days: 30
